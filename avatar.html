<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>张哲画像馆 - 张哲的世界</title>
<link rel="stylesheet" href="css/common.css">
<style>
.avatar-workspace { display:grid; grid-template-columns:1fr 360px; gap:24px; }
@media(max-width:768px){ .avatar-workspace { grid-template-columns:1fr; } }
.preview-area { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); padding:24px; text-align:center; min-height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.preview-area canvas { border-radius:var(--radius); max-width:100%; }
.controls { display:flex; flex-direction:column; gap:16px; }
.control-group { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:16px; }
.control-group h4 { font-size:14px; margin-bottom:12px; color:var(--text-muted); }
.option-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.option-btn { padding:10px 6px; border:0.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); cursor:pointer; font-size:22px; text-align:center; transition:all 0.2s; font-family:var(--font); }
.option-btn:hover { border-color:var(--rose); background:var(--rose-light); }
.option-btn.selected { border-color:var(--rose); background:var(--rose-light); }
.color-options { display:flex; gap:8px; flex-wrap:wrap; }
.color-dot { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all 0.2s; }
.color-dot.selected { border-color:var(--text); transform:scale(1.2); }
</style>
</head>
<body>
<div class="nav" id="siteNav"></div>
<div class="container">
  <h1 class="title">🎨 张哲画像馆</h1>
  <p class="subtitle mb-24">DIY 专属于张哲的卡通头像</p>

  <div class="avatar-workspace">
    <div class="preview-area">
      <canvas id="avatarCanvas" width="300" height="300"></canvas>
      <button class="btn btn-primary mt-16" onclick="downloadAvatar()">📥 下载头像</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <h4>👤 脸型</h4>
        <div class="option-grid" id="faceOptions"></div>
      </div>
      <div class="control-group">
        <h4>👀 眼睛</h4>
        <div class="option-grid" id="eyeOptions"></div>
      </div>
      <div class="control-group">
        <h4>👄 嘴巴</h4>
        <div class="option-grid" id="mouthOptions"></div>
      </div>
      <div class="control-group">
        <h4>💇 发型</h4>
        <div class="option-grid" id="hairOptions"></div>
      </div>
      <div class="control-group">
        <h4>🎨 肤色</h4>
        <div class="color-options" id="skinColors"></div>
      </div>
      <div class="control-group">
        <h4>👕 衣服颜色</h4>
        <div class="color-options" id="clothColors"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
const zz = zzLoad();
const parts = {
  face: ['😊','😄','😎','🤓','😏','😌','😳','😤'],
  eyes: ['👀','😍','🤩','😶'],
  mouth: ['😗','😋','😛','🫤'],
  hair: ['💇','🧑','👨','👩']
};
const skins = ['#fce4d6','#f8c9a8','#e8b88a','#d4a574','#c4956a','#f5d5c8'];
const cloths = ['#e8536c','#4a8fe7','#3d9e8b','#7b5ea7','#d4a843','#333333','#ffffff'];

let state = { face:0, eyes:0, mouth:0, hair:0, skin:0, cloth:0 };

function init(){
  initNav('avatar.html');
  renderControls();
  drawAvatar();
}

function renderControls(){
  ['face','eyes','mouth','hair'].forEach(part=>{
    document.getElementById(part+'Options').innerHTML = parts[part].map((e,i)=>
      `<button class="option-btn${state[part]===i?' selected':''}" onclick="selectPart('${part}',${i})">${e}</button>`
    ).join('');
  });
  document.getElementById('skinColors').innerHTML = skins.map((c,i)=>
    `<div class="color-dot${state.skin===i?' selected':''}" style="background:${c}" onclick="selectPart('skin',${i})" title="肤色${i+1}"></div>`
  ).join('');
  document.getElementById('clothColors').innerHTML = cloths.map((c,i)=>
    `<div class="color-dot${state.cloth===i?' selected':''}" style="background:${c}" onclick="selectPart('cloth',${i})" title="颜色${i+1}"></div>`
  ).join('');
}

function selectPart(part,index){
  state[part] = index;
  renderControls();
  drawAvatar();
}

function drawAvatar(){
  const c = document.getElementById('avatarCanvas');
  const ctx = c.getContext('2d');
  const w=300,h=300;
  ctx.clearRect(0,0,w,h);

  // background circle
  ctx.beginPath(); ctx.arc(150,150,140,0,Math.PI*2);
  ctx.fillStyle = '#fdf8f9'; ctx.fill();

  // body/clothes
  ctx.beginPath(); ctx.arc(150,250,90,0,Math.PI);
  ctx.fillStyle = cloths[state.cloth]; ctx.fill();

  // face
  ctx.beginPath(); ctx.arc(150,140,70,0,Math.PI*2);
  ctx.fillStyle = skins[state.skin]; ctx.fill();

  // hair
  ctx.beginPath(); ctx.arc(150,125,75,Math.PI,0);
  const hairColors = ['#2c1810','#3d2315','#1a1a2e','#8b4513','#4a3728'];
  ctx.fillStyle = hairColors[state.hair % hairColors.length]; ctx.fill();

  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(125,135,18,14,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(175,135,18,14,0,0,Math.PI*2); ctx.fill();
  const eyeColors = ['#2c1810','#3d6b9e','#5a3d2e','#1a5c1a'];
  ctx.fillStyle = eyeColors[state.eyes % eyeColors.length];
  ctx.beginPath(); ctx.arc(125,135,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(175,135,7,0,Math.PI*2); ctx.fill();

  // mouth
  const mouths = [
    ()=>{ ctx.beginPath(); ctx.arc(150,165,18,0.1*Math.PI,0.9*Math.PI); ctx.stroke(); },
    ()=>{ ctx.beginPath(); ctx.arc(150,170,14,0,Math.PI); ctx.stroke(); },
    ()=>{ ctx.beginPath(); ctx.ellipse(150,170,10,6,0,0,Math.PI*2); ctx.fill(); },
    ()=>{ ctx.beginPath(); ctx.moveTo(140,170); ctx.lineTo(160,170); ctx.stroke(); }
  ];
  ctx.strokeStyle = '#c0394b'; ctx.lineWidth = 3; ctx.fillStyle = '#c0394b';
  (mouths[state.mouth]||mouths[0])();

  // eyebrows (based on face)
  ctx.strokeStyle = hairColors[state.hair % hairColors.length];
  ctx.lineWidth = 4;
  const eyebrowArcs = [
    ()=>{ ctx.beginPath(); ctx.moveTo(110,115); ctx.quadraticCurveTo(125,108,140,115); ctx.stroke(); ctx.beginPath(); ctx.moveTo(160,115); ctx.quadraticCurveTo(175,108,190,115); ctx.stroke(); },
    ()=>{ ctx.beginPath(); ctx.moveTo(110,115); ctx.quadraticCurveTo(125,120,140,115); ctx.stroke(); ctx.beginPath(); ctx.moveTo(160,115); ctx.quadraticCurveTo(175,120,190,115); ctx.stroke(); },
    ()=>{ ctx.beginPath(); ctx.moveTo(110,112); ctx.quadraticCurveTo(125,106,140,112); ctx.stroke(); ctx.beginPath(); ctx.moveTo(160,112); ctx.quadraticCurveTo(175,106,190,112); ctx.stroke(); },
    ()=>{ ctx.beginPath(); ctx.moveTo(110,118); ctx.quadraticCurveTo(125,112,140,118); ctx.stroke(); ctx.beginPath(); ctx.moveTo(160,118); ctx.quadraticCurveTo(175,112,190,118); ctx.stroke(); }
  ];
  (eyebrowArcs[state.face]||eyebrowArcs[0])();

  // blush
  ctx.fillStyle = 'rgba(232,83,108,0.15)';
  ctx.beginPath(); ctx.ellipse(108,155,14,8,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(192,155,14,8,0,0,Math.PI*2); ctx.fill();

  // Name label
  ctx.fillStyle = 'var(--text)';
  ctx.font = 'bold 16px ' + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = 'center';
  ctx.fillText(zz.nickname||zz.name, 150, 285);
}

function downloadAvatar(){
  const c = document.getElementById('avatarCanvas');
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = `zhangzhe-avatar-${Date.now()}.png`;
  a.click();
  showToast('头像已下载！');
}

init();
</script>
</body>
</html>
