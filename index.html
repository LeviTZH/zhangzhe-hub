<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>张哲的世界</title>
<link rel="stylesheet" href="css/common.css">
<style>
.hero { text-align:center; padding:48px 20px 32px; }
.hero .avatar { font-size:72px; margin-bottom:16px; display:block; }
.hero h1 { font-size:32px; font-weight:700; color:var(--text); margin-bottom:8px; }
.hero .bio { font-size:15px; color:var(--text-muted); max-width:500px; margin:0 auto; line-height:1.7; }
.hero .quick-stats { display:flex; gap:24px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
.quick-stat { text-align:center; min-width:80px; }
.quick-stat .num { font-size:24px; font-weight:600; color:var(--rose); }
.quick-stat .lbl { font-size:12px; color:var(--text-muted); margin-top:2px; }
.features-section { padding:8px 0 40px; }
.features-section h2 { font-size:20px; margin-bottom:20px; text-align:center; }
.about-section { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:24px; }
.about-section h2 { font-size:18px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.fav-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.fav-tags span { padding:5px 12px; background:var(--rose-light); border-radius:20px; font-size:12px; color:var(--rose); }
.upcoming { margin-top:20px; }
.upcoming-item { display:flex; align-items:center; gap:12px; padding:12px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:8px; }
.upcoming-item .days-badge { padding:6px 12px; background:var(--rose); color:#fff; border-radius:var(--radius-sm); font-weight:600; font-size:13px; min-width:60px; text-align:center; white-space:nowrap; }
.upcoming-item .info { flex:1; }
.upcoming-item .info .event { font-size:14px; font-weight:500; }
.upcoming-item .info .date { font-size:12px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="nav" id="siteNav"></div>

<div class="container">
  <div class="hero">
    <span class="avatar" id="heroAvatar">🦊</span>
    <h1 id="heroName">张哲的世界</h1>
    <p class="bio" id="heroBio">探索关于张哲的一切</p>
    <div class="quick-stats" id="quickStats"></div>
  </div>

  <div class="features-section">
    <h2>✨ 探索功能</h2>
    <div class="grid-3" id="featureGrid"></div>
  </div>

  <div class="about-section" id="aboutSection">
    <h2>❤ 关于张哲</h2>
    <div id="aboutContent"></div>
  </div>

  <div class="about-section" id="upcomingSection">
    <h2>📅 即将到来的日子</h2>
    <div id="upcomingList"></div>
  </div>
</div>

<script src="https://unpkg.com/minapp-sdk@3.23.6"></script>
<script src="js/common.js"></script>
<script src="js/data.js"></script>

<script>
const zz = zzLoad();

function init(){
  initNav('index.html');
  document.getElementById('heroAvatar').textContent = zz.avatar;
  document.getElementById('heroName').textContent = zz.siteTitle || '张哲的世界';
  document.getElementById('heroBio').textContent = zz.siteSubtitle || '探索关于张哲的一切';

  const birthdays = daysUntil(zz.birthday);
  const nextBday = birthdays < 0 ? daysUntil((new Date().getFullYear()+1)+'-'+(zz.birthday.split('-').slice(1).join('-'))) : birthdays;

  document.getElementById('quickStats').innerHTML = `
    <div class="quick-stat"><div class="num">${(zz.memories||[]).length}</div><div class="lbl">纪念日</div></div>
    <div class="quick-stat"><div class="num">${nextBday}</div><div class="lbl">天后生日</div></div>
    <div class="quick-stat"><div class="num">${(zz.quizQuestions||[]).length}</div><div class="lbl">冷知识题</div></div>
    <div class="quick-stat"><div class="num">${(zz.adventureScenes||[]).filter(s=>s.ending).length}</div><div class="lbl">冒险结局</div></div>
  `;

  const features = [
    { href:'love-test.html', icon:'💕', name:'爱情测试', desc:'输入名字，看看张哲喜不喜欢你！多轮问答 + 缘分指数', color:'rose' },
    { href:'adventure.html', icon:'🎮', name:'张哲大冒险', desc:'扮演张哲，在文字冒险中做出选择，走向不同结局', color:'teal' },
    { href:'countdown.html', icon:'📅', name:'倒计时日历', desc:'纪念日倒计时，记录关于张哲的每一个重要日子', color:'purple' },
    { href:'avatar.html', icon:'🎨', name:'张哲画像馆', desc:'DIY 张哲风格头像，拼贴五官特征，生成专属画像', color:'gold' },
    { href:'radio.html', icon:'🎵', name:'张哲电台', desc:'复古收音机风格，播放张哲喜欢的歌，频谱可视化', color:'blue' },
    { href:'wall.html', icon:'💬', name:'留言墙', desc:'给张哲留下想说的话，彩色便签飘落墙面', color:'rose' },
    { href:'quiz.html', icon:'🏆', name:'谁最了解张哲', desc:'冷知识计时答题挑战，看看谁是真正的张哲通', color:'teal' },
    { href:'editor.html', icon:'⚙', name:'信息编辑器', desc:'自定义张哲的档案，全站数据一键同步更新', color:'purple' }
  ];

  document.getElementById('featureGrid').innerHTML = features.map(f =>
    `<a href="${f.href}" class="feature-card">
      <div class="icon">${f.icon}</div>
      <div class="name">${f.name}</div>
      <div class="desc">${f.desc}</div>
    </a>`
  ).join('');

  const favs = zz.favorites||{};
  document.getElementById('aboutContent').innerHTML = `
    <p style="font-size:14px;line-height:1.8;margin-bottom:16px;">${zz.bio}</p>
    ${favs.games&&favs.games.length?`<p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">🎮 喜欢的游戏</p><div class="fav-tags">${favs.games.map(g=>`<span>${g}</span>`).join('')}</div>`:''}
    ${favs.foods&&favs.foods.length?`<p style="font-size:13px;color:var(--text-muted);margin-top:12px;margin-bottom:8px;">🍔 喜欢的食物</p><div class="fav-tags">${favs.foods.map(g=>`<span>${g}</span>`).join('')}</div>`:''}
    ${favs.colors&&favs.colors.length?`<p style="font-size:13px;color:var(--text-muted);margin-top:12px;margin-bottom:8px;">🎨 喜欢的颜色</p><div class="fav-tags">${favs.colors.map(g=>`<span>${g}</span>`).join('')}</div>`:''}
  `;

  const upcoming = (zz.memories||[]).map(m=>({...m,days:daysUntil(m.date)})).filter(m=>m.days>=0).sort((a,b)=>a.days-b.days);
  document.getElementById('upcomingList').innerHTML = upcoming.length
    ? upcoming.slice(0,5).map(m=>`
      <div class="upcoming-item">
        <div class="days-badge">${m.days===0?'今天':m.days+'天后'}</div>
        <div class="info"><div class="event">${m.emoji||''} ${m.label}</div><div class="date">${formatDate(m.date)}</div></div>
      </div>`).join('')
    : '<p class="text-muted">暂无即将到来的纪念日，去<a href="editor.html">编辑器</a>添加吧</p>';
}

init();
</script>
</body>
</html>
