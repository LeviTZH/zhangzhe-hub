<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>谁最了解张哲 - 张哲的世界</title>
<link rel="stylesheet" href="css/common.css">
<style>
.quiz-card { max-width:560px; margin:0 auto; background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); padding:32px 24px; }
.quiz-intro { text-align:center; }
.quiz-intro .q-icon { font-size:56px; display:block; margin-bottom:16px; }
.timer-bar { height:4px; background:var(--border-light); border-radius:2px; margin-bottom:8px; overflow:hidden; }
.timer-fill { height:100%; background:var(--rose); border-radius:2px; transition:width 0.1s linear; }
.timer-text { font-size:12px; color:var(--text-muted); text-align:right; margin-bottom:16px; }
.question-num { font-size:13px; color:var(--text-muted); margin-bottom:8px; }
.question-text { font-size:18px; font-weight:600; margin-bottom:20px; line-height:1.5; }
.option-btn { display:block; width:100%; padding:14px; margin-bottom:10px; border:0.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:15px; cursor:pointer; transition:all 0.2s; font-family:var(--font); color:var(--text); text-align:left; }
.option-btn:hover { border-color:var(--rose); }
.option-btn.correct { border-color:var(--teal)!important; background:var(--teal-light)!important; }
.option-btn.wrong { border-color:var(--rose)!important; background:var(--rose-light)!important; }
.option-btn:disabled { cursor:default; opacity:0.7; }
.result-card { text-align:center; }
.result-card .final-score { font-size:56px; font-weight:700; color:var(--rose); }
.result-card .final-label { font-size:14px; color:var(--text-muted); margin-bottom:20px; }
.leaderboard { margin-top:24px; }
.lb-item { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:8px; }
.lb-rank { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; background:var(--rose-light); color:var(--rose); }
.lb-rank.gold { background:#fdf3e0; color:var(--gold); }
.lb-rank.silver { background:var(--border-light); color:var(--text-muted); }
.lb-name { flex:1; font-size:14px; font-weight:500; }
.lb-score { font-size:14px; color:var(--rose); font-weight:600; }
.lb-time { font-size:12px; color:var(--text-hint); width:50px; text-align:right; }
</style>
</head>
<body>
<div class="nav" id="siteNav"></div>
<div class="container">
  <div class="quiz-card" id="quizScreen"></div>
</div>
<script src="js/common.js"></script>
<script>
const LB_KEY = 'zz_quiz_lb';
const TIME_PER_Q = 10;
const zz = zzLoad();
let state = { phase:'intro', questions:[], currentQ:0, score:0, answers:[], startTime:0, timeLeft:0 };
let timerInterval = null;

function init(){
  initNav('quiz.html');
  state.questions = shuffleQuestions(zz.quizQuestions||[]).slice(0,10);
  render();
}

function shuffleQuestions(qs){
  const arr = [...qs];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function render(){
  const s = document.getElementById('quizScreen');
  if(state.phase==='intro'){
    s.innerHTML = `
      <div class="quiz-intro">
        <span class="q-icon">🏆</span>
        <div class="step-title">谁最了解${zz.name}？</div>
        <div class="step-desc">${state.questions.length} 道冷知识题，计时作答<br>每题限时 ${TIME_PER_Q} 秒，快来挑战！</div>
        <input class="input mb-16" id="playerName" placeholder="输入你的名字" style="text-align:center;font-size:16px;" onkeydown="if(event.key==='Enter')startQuiz()">
        <button class="btn btn-primary btn-block" onclick="startQuiz()">开始挑战</button>
        <div class="leaderboard mt-24" id="lbIntro"></div>
      </div>`;
    renderLB('lbIntro');
  } else if(state.phase==='playing'){
    const q = state.questions[state.currentQ];
    s.innerHTML = `
      <div class="timer-bar"><div class="timer-fill" style="width:100%" id="timerFill"></div></div>
      <div class="timer-text" id="timerText">${TIME_PER_Q}s</div>
      <div class="question-num">第 ${state.currentQ+1}/${state.questions.length} 题</div>
      <div class="question-text">${q.q}</div>
      ${q.opts.map((o,i)=>`<button class="option-btn" id="opt${i}" onclick="submitAnswer(${i})">${o}</button>`).join('')}
    `;
    startTimer();
  } else if(state.phase==='result'){
    const pct = Math.round((state.score/state.questions.length)*100);
    const totalSec = Math.round((Date.now()-state.startTime)/1000);
    s.innerHTML = `
      <div class="result-card">
        <span style="font-size:48px;">${pct>=80?'🎉':pct>=50?'😊':'📚'}</span>
        <div class="final-score">${state.score}/${state.questions.length}</div>
        <div class="final-label">正确率 ${pct}% · 用时 ${totalSec}s</div>
        <button class="btn btn-primary" onclick="saveAndShowLB()">💾 保存成绩</button>
        <button class="btn btn-outline btn-sm mt-8" onclick="state.phase='intro';state.score=0;state.currentQ=0;state.answers=[];render()">🔄 再测一次</button>
        <div class="leaderboard mt-24" id="lbResult"></div>
      </div>`;
    renderLB('lbResult');
  }
}

function startQuiz(){
  const name = (document.getElementById('playerName')?.value||'').trim() || '匿名玩家';
  state.playerName = name;
  state.phase = 'playing';
  state.currentQ = 0;
  state.score = 0;
  state.answers = [];
  state.startTime = Date.now();
  render();
}

function startTimer(){
  state.timeLeft = TIME_PER_Q;
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    state.timeLeft--;
    const fill = document.getElementById('timerFill');
    const text = document.getElementById('timerText');
    if(fill) fill.style.width = (state.timeLeft/TIME_PER_Q*100)+'%';
    if(text) text.textContent = state.timeLeft+'s';
    if(state.timeLeft<=3 && fill) fill.style.background = 'var(--rose-dark)';
    if(state.timeLeft<=0){
      clearInterval(timerInterval);
      submitAnswer(-1);
    }
  },1000);
}

function submitAnswer(choice){
  clearInterval(timerInterval);
  const q = state.questions[state.currentQ];
  const correct = choice === q.ans;

  if(correct) state.score++;

  // show feedback
  document.querySelectorAll('.option-btn').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.ans) b.classList.add('correct');
    else if(i===choice && !correct) b.classList.add('wrong');
  });

  setTimeout(()=>{
    state.currentQ++;
    if(state.currentQ >= state.questions.length){
      state.phase = 'result';
    }
    render();
  }, correct?600:1000);
}

function saveAndShowLB(){
  const lb = getLB();
  const totalSec = Math.round((Date.now()-state.startTime)/1000);
  lb.push({ name:state.playerName, score:state.score, total:state.questions.length, time:totalSec, date:Date.now() });
  lb.sort((a,b)=>b.score-a.score || a.time-b.time);
  if(lb.length>50) lb.length = 50;
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
  render();
  showToast('成绩已保存！');
}

function getLB(){
  try{ return JSON.parse(localStorage.getItem(LB_KEY)||'[]'); } catch(e){ return []; }
}

function renderLB(targetId){
  const lb = getLB();
  const el = document.getElementById(targetId);
  if(!el) return;
  if(!lb.length){
    el.innerHTML = '<p class="text-muted text-center">还没有人挑战过，来做第一个吧！</p>';
    return;
  }
  el.innerHTML = '<h3 class="section-title">📊 排行榜</h3>' + lb.slice(0,10).map((e,i)=>{
    const rankClass = i===0?'gold':i===1?'silver':'';
    return `<div class="lb-item">
      <div class="lb-rank ${rankClass}">${i+1}</div>
      <div class="lb-name">${esc(e.name)}</div>
      <div class="lb-score">${e.score}/${e.total}</div>
      <div class="lb-time">${e.time}s</div>
    </div>`;
  }).join('');
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

init();
</script>
</body>
</html>
