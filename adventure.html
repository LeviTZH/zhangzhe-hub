<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>张哲大冒险 - 张哲的世界</title>
<link rel="stylesheet" href="css/common.css">
<style>
.adventure-card { max-width:560px; margin:0 auto; background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius); padding:32px 24px; }
.scene-text { font-size:16px; line-height:1.8; margin-bottom:24px; min-height:60px; }
.choice-btn { display:block; width:100%; padding:14px 18px; margin-bottom:10px; border:0.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:15px; cursor:pointer; transition:all 0.2s; font-family:var(--font); color:var(--text); text-align:left; }
.choice-btn:hover { border-color:var(--rose); background:var(--rose-light); transform:translateX(4px); }
.choice-btn .arrow { float:right; opacity:0; transition:opacity 0.2s; }
.choice-btn:hover .arrow { opacity:1; }
.ending-card { text-align:center; padding:20px; }
.ending-emoji { font-size:64px; display:block; margin-bottom:16px; }
.ending-label { font-size:20px; font-weight:600; margin-bottom:8px; }
.ending-type { font-size:14px; color:var(--text-muted); }
.history { margin-top:24px; padding-top:16px; border-top:0.5px solid var(--border-light); }
.history-item { font-size:12px; color:var(--text-muted); padding:4px 0; }
.history-item::before { content:'→ '; color:var(--rose); }
</style>
</head>
<body>
<div class="nav" id="siteNav"></div>
<div class="container">
  <div class="adventure-card" id="adventureScreen"></div>
</div>
<script src="js/common.js"></script>
<script>
const zz = zzLoad();
let scenes = {};
let history = [];
let currentScene = 'start';

function init(){
  initNav('adventure.html');
  scenes = {};
  (zz.adventureScenes||[]).forEach(s=>{ scenes[s.id]=s; });
  if(!scenes['start']){
    scenes['start'] = { id:'start', text:'冒险开始了！但是还没有配置剧情。去编辑器添加场景吧~', choices:[{text:'去编辑器', next:'editor'}] };
    scenes['editor'] = { id:'editor', text:'<a href="editor.html">点这里打开编辑器</a>', ending:'empty' };
  }
  render();
}

function render(){
  const scene = scenes[currentScene] || scenes['start'];
  const s = document.getElementById('adventureScreen');

  if(scene.ending){
    const endingNames = { happy:'🎉 美满结局', lucky:'🍀 幸运结局', cozy:'🌙 温馨结局', sad:'😢 遗憾结局', empty:'📭 暂无内容' };
    s.innerHTML = `
      <div class="ending-card">
        <span class="ending-emoji">${scene.emoji||'✨'}</span>
        <div class="ending-label">${endingNames[scene.ending]||'结局'}</div>
        <div class="ending-type">${scene.text}</div>
        <button class="btn btn-primary mt-24" onclick="restart()">🔄 再来一次</button>
        ${history.length>0?`<div class="history"><p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">你的冒险轨迹</p>${history.map(h=>`<div class="history-item">${h}</div>`).join('')}</div>`:''}
      </div>`;
    return;
  }

  s.innerHTML = `
    <p class="scene-text">${scene.text}</p>
    ${(scene.choices||[]).map((c,i)=>`
      <button class="choice-btn" onclick="choose(${i})">${c.text}<span class="arrow">→</span></button>
    `).join('')}
    ${history.length>0?`<div class="history" style="margin-top:16px;">${history.slice(-3).map(h=>`<div class="history-item">${h}</div>`).join('')}</div>`:''}
  `;
}

function choose(i){
  const scene = scenes[currentScene];
  if(!scene||!scene.choices) return;
  const choice = scene.choices[i];
  if(!choice) return;
  history.push(choice.text);
  currentScene = choice.next;
  render();
}

function restart(){
  history = [];
  currentScene = 'start';
  render();
}

init();
</script>
</body>
</html>
