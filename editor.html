<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>张哲信息编辑器</title>
<link rel="stylesheet" href="css/common.css">
<style>
.editor-tabs { display:flex; gap:4px; margin-bottom:20px; flex-wrap:wrap; }
.editor-tabs button { padding:8px 16px; border:0.5px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); cursor:pointer; font-size:13px; color:var(--text-muted); font-family:var(--font); transition:all 0.2s; }
.editor-tabs button.active { background:var(--rose); color:#fff; border-color:var(--rose); }
.editor-panel { display:none; }
.editor-panel.active { display:block; }
.tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:var(--rose-light); border-radius:20px; font-size:12px; color:var(--rose); }
.tag button { background:none; border:none; color:var(--rose); cursor:pointer; font-size:14px; padding:0 2px; line-height:1; }
.scene-item { background:var(--bg); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; }
.scene-item .choices { margin-top:8px; padding-left:16px; border-left:2px solid var(--rose-light); }
.choice-row { display:flex; gap:8px; margin-top:6px; align-items:center; }
.memory-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.quiz-row { background:var(--bg); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; }
.quiz-row .opts-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
@media(max-width:500px){ .quiz-row .opts-grid { grid-template-columns:1fr; } }
pre { background:var(--bg); border-radius:var(--radius-sm); padding:12px; font-size:12px; overflow-x:auto; max-height:300px; font-family:monospace; }
</style>
</head>
<body>
<div class="nav" id="siteNav"></div>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:8px;">
    <div>
      <h1 class="title">⚙ 张哲信息编辑器</h1>
      <p class="subtitle">修改这里的数据，整个网站的所有页面都会同步更新</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" onclick="exportData()">📤 导出数据</button>
      <button class="btn btn-outline btn-sm" onclick="importData()">📥 导入数据</button>
      <button class="btn btn-outline btn-sm" onclick="resetAll()" style="color:var(--rose);border-color:var(--rose);">🔄 恢复默认</button>
    </div>
  </div>

  <div class="editor-tabs" id="tabs"></div>

  <div id="panels"></div>

  <div class="mt-24 flex gap-8" style="justify-content:center;">
    <button class="btn btn-primary btn-lg" onclick="saveAndApply()" style="font-size:16px;padding:12px 40px;">💾 保存并应用到全站</button>
  </div>
  <p id="saveStatus" class="text-muted text-center mt-8"></p>
</div>

<input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImport(event)">

<script src="js/common.js"></script>
<script>
let editingData = zzLoad();
let activeTab = 'basic';

const tabs = [
  { id:'basic', label:'基本信息', icon:'👤' },
  { id:'memories', label:'纪念日', icon:'📅' },
  { id:'favorites', label:'喜好', icon:'❤' },
  { id:'quiz', label:'答题题库', icon:'❓' },
  { id:'adventure', label:'大冒险剧情', icon:'🎮' },
  { id:'site', label:'网站设置', icon:'🌐' },
  { id:'raw', label:'原始JSON', icon:'{}' }
];

function init(){
  initNav('editor.html');
  renderTabs();
  switchTab('basic');
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`
  ).join('');
}
function switchTab(id){
  activeTab = id;
  renderTabs();
  renderPanel(id);
}
function renderPanel(id){
  const d = editingData;
  let html = '';
  switch(id){
    case 'basic':
      html = `
        <div class="card">
          <div class="form-group"><label class="label">姓名</label><input class="input" value="${esc(d.name)}" onchange="setField('name',this.value)"></div>
          <div class="form-group"><label class="label">昵称</label><input class="input" value="${esc(d.nickname)}" onchange="setField('nickname',this.value)"></div>
          <div class="form-group"><label class="label">头像 Emoji</label><input class="input" value="${esc(d.avatar)}" onchange="setField('avatar',this.value)" style="max-width:120px;font-size:24px;"></div>
          <div class="form-group"><label class="label">个人简介</label><textarea class="textarea" onchange="setField('bio',this.value)" rows="3">${esc(d.bio)}</textarea></div>
          <div class="form-group"><label class="label">生日</label><input class="input" type="date" value="${d.birthday}" onchange="setField('birthday',this.value)" style="max-width:200px;"></div>
        </div>`;
      break;
    case 'memories':
      html = `<div class="card"><div class="flex-between mb-16"><h3 class="section-title" style="margin:0">纪念日列表</h3><button class="btn btn-outline btn-sm" onclick="addMemory()">+ 添加</button></div>`;
      (d.memories||[]).forEach((m,i)=>{
        html += `<div class="memory-row">
          <input class="input" type="date" value="${m.date}" onchange="editMemory(${i},'date',this.value)" style="max-width:160px;">
          <input class="input" value="${esc(m.label)}" onchange="editMemory(${i},'label',this.value)" placeholder="事件名称" style="flex:1;min-width:120px;">
          <input class="input" value="${esc(m.emoji||'')}" onchange="editMemory(${i},'emoji',this.value)" placeholder="Emoji" style="max-width:70px;">
          <button class="btn btn-outline btn-sm" onclick="removeMemory(${i})" style="color:var(--rose)">删除</button>
        </div>`;
      });
      html += `</div>`;
      break;
    case 'favorites':
      const favs = d.favorites||{};
      html = `<div class="card">`;
      ['games','foods','songs','colors'].forEach(cat=>{
        const items = favs[cat]||[];
        html += `<div class="form-group"><label class="label">${cat==='games'?'喜欢的游戏':cat==='foods'?'喜欢的食物':cat==='songs'?'喜欢的歌':cat==='colors'?'喜欢的颜色':''}</label>
          <div style="display:flex;gap:8px;"><input class="input" id="favInput_${cat}" placeholder="输入后回车添加" style="flex:1;" onkeydown="if(event.key==='Enter'){addFavItem('${cat}',this.value);this.value=''}">
          <button class="btn btn-outline btn-sm" onclick="addFavItem('${cat}',document.getElementById('favInput_${cat}').value);document.getElementById('favInput_${cat}').value=''">添加</button></div>
          <div class="tag-list">${items.map((it,i)=>`<span class="tag">${esc(it)}<button onclick="removeFavItem('${cat}',${i})">×</button></span>`).join('')}</div></div>`;
      });
      html += `</div>`;
      break;
    case 'quiz':
      html = `<div class="card"><div class="flex-between mb-16"><h3 class="section-title" style="margin:0">答题题库</h3><button class="btn btn-outline btn-sm" onclick="addQuiz()">+ 添加题目</button></div>`;
      (d.quizQuestions||[]).forEach((q,i)=>{
        html += `<div class="quiz-row">
          <div class="flex-between"><strong style="font-size:14px;">第${i+1}题</strong><button class="btn btn-outline btn-sm" onclick="removeQuiz(${i})" style="color:var(--rose)">删除</button></div>
          <div class="form-group mt-8"><input class="input" value="${esc(q.q)}" onchange="editQuiz(${i},'q',this.value)" placeholder="题目"></div>
          <div class="opts-grid">
            ${(q.opts||[]).map((o,oi)=>`<div style="display:flex;align-items:center;gap:6px;">
              <input type="radio" name="quizAns${i}" ${q.ans===oi?'checked':''} onchange="editQuiz(${i},'ans',${oi})">
              <input class="input" value="${esc(o)}" onchange="editQuiz(${i},'opts',this.value,${oi})" placeholder="选项${oi+1}">
            </div>`).join('')}
          </div>
        </div>`;
      });
      html += `</div>`;
      break;
    case 'adventure':
      html = `<div class="card"><div class="flex-between mb-16"><h3 class="section-title" style="margin:0">大冒险场景</h3><button class="btn btn-outline btn-sm" onclick="addScene()">+ 添加场景</button></div>`;
      (d.adventureScenes||[]).forEach((s,i)=>{
        html += `<div class="scene-item">
          <div class="flex-between"><strong>场景：${esc(s.id)}</strong><button class="btn btn-outline btn-sm" onclick="removeScene(${i})" style="color:var(--rose)">删除</button></div>
          <div class="form-group mt-8"><label class="label">场景 ID</label><input class="input" value="${esc(s.id)}" onchange="editScene(${i},'id',this.value)"></div>
          <div class="form-group"><label class="label">叙述文字</label><textarea class="textarea" onchange="editScene(${i},'text',this.value)">${esc(s.text||'')}</textarea></div>
          ${s.ending?`<div class="form-group"><label class="label">结局类型</label><div style="display:flex;gap:8px;"><input class="input" value="${esc(s.ending)}" onchange="editScene(${i},'ending',this.value)" style="max-width:120px;"><input class="input" value="${esc(s.emoji||'')}" onchange="editScene(${i},'emoji',this.value)" style="max-width:70px;" placeholder="emoji"></div></div>`:''}
          <div class="choices"><div class="flex-between"><span style="font-size:13px;color:var(--text-muted)">选择分支</span><button class="btn btn-outline btn-sm" onclick="addChoice(${i})">+ 添加选项</button></div>
          ${(s.choices||[]).map((c,ci)=>`<div class="choice-row">
            <input class="input" value="${esc(c.text)}" onchange="editChoice(${i},${ci},'text',this.value)" placeholder="选项文字" style="flex:1;">
            <span style="font-size:12px;color:var(--text-muted)">→</span>
            <input class="input" value="${esc(c.next||'')}" onchange="editChoice(${i},${ci},'next',this.value)" placeholder="下一场景ID" style="max-width:120px;">
            <button class="btn btn-outline btn-sm" onclick="removeChoice(${i},${ci})" style="color:var(--rose)">×</button>
          </div>`).join('')}
          </div>
        </div>`;
      });
      html += `</div>`;
      break;
    case 'site':
      html = `<div class="card">
        <div class="form-group"><label class="label">网站标题</label><input class="input" value="${esc(d.siteTitle||'')}" onchange="setField('siteTitle',this.value)"></div>
        <div class="form-group"><label class="label">网站副标题</label><input class="input" value="${esc(d.siteSubtitle||'')}" onchange="setField('siteSubtitle',this.value)"></div>
        <div class="form-group"><label class="label">主题色</label><input class="input" type="color" value="${d.primaryColor||'#e8536c'}" onchange="setField('primaryColor',this.value)" style="max-width:80px;height:40px;"></div>
      </div>`;
      break;
    case 'raw':
      html = `<div class="card"><p class="text-muted mb-16">直接编辑完整 JSON（高级用户）</p>
        <textarea class="textarea" id="rawJSON" style="min-height:400px;font-family:monospace;font-size:12px;">${esc(JSON.stringify(editingData,null,2))}</textarea>
        <button class="btn btn-outline mt-16" onclick="parseRaw()">解析 JSON 并应用</button></div>`;
      break;
  }
  document.getElementById('panels').innerHTML = `<div class="editor-panel active">${html}</div>`;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setField(k,v){ editingData[k]=v; }
function addMemory(){ if(!editingData.memories)editingData.memories=[]; editingData.memories.push({date:'2026-06-10',label:'新事件',emoji:'📌'}); switchTab('memories'); }
function editMemory(i,k,v){ editingData.memories[i][k]=v; }
function removeMemory(i){ editingData.memories.splice(i,1); switchTab('memories'); }
function addFavItem(cat,v){ if(!v.trim())return; if(!editingData.favorites)editingData.favorites={}; if(!editingData.favorites[cat])editingData.favorites[cat]=[]; editingData.favorites[cat].push(v.trim()); switchTab('favorites'); }
function removeFavItem(cat,i){ editingData.favorites[cat].splice(i,1); switchTab('favorites'); }
function addQuiz(){ if(!editingData.quizQuestions)editingData.quizQuestions=[]; editingData.quizQuestions.push({q:'新题目',opts:['选项1','选项2','选项3','选项4'],ans:0}); switchTab('quiz'); }
function editQuiz(i,k,v,oi){ if(k==='opts')editingData.quizQuestions[i].opts[oi]=v; else editingData.quizQuestions[i][k]=v; switchTab('quiz'); }
function removeQuiz(i){ editingData.quizQuestions.splice(i,1); switchTab('quiz'); }
function addScene(){ if(!editingData.adventureScenes)editingData.adventureScenes=[]; editingData.adventureScenes.push({id:'new_scene',text:'新场景描述...',choices:[{text:'选项1',next:'start'}]}); switchTab('adventure'); }
function editScene(i,k,v){ editingData.adventureScenes[i][k]=v; }
function removeScene(i){ editingData.adventureScenes.splice(i,1); switchTab('adventure'); }
function addChoice(i){ if(!editingData.adventureScenes[i].choices)editingData.adventureScenes[i].choices=[]; delete editingData.adventureScenes[i].ending; editingData.adventureScenes[i].choices.push({text:'新选项',next:'start'}); switchTab('adventure'); }
function editChoice(si,ci,k,v){ editingData.adventureScenes[si].choices[ci][k]=v; }
function removeChoice(si,ci){ editingData.adventureScenes[si].choices.splice(ci,1); switchTab('adventure'); }
function parseRaw(){ try{ editingData=JSON.parse(document.getElementById('rawJSON').value); switchTab('raw'); showToast('JSON 解析成功'); }catch(e){ showToast('JSON 格式错误！'); } }

function saveAndApply(){
  if(zzSave(editingData)){
    document.getElementById('saveStatus').textContent = '✅ 已保存 — ' + new Date().toLocaleTimeString();
    showToast('数据已保存，全站同步！');
  } else {
    showToast('保存失败，请检查存储空间');
  }
}

function resetAll(){
  if(confirm('确定要恢复所有数据到默认值吗？此操作不可撤销！')){
    editingData = zzReset();
    switchTab(activeTab);
    showToast('已恢复默认数据');
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify(editingData,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zhangzhe-data-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('数据已导出');
}

function importData(){
  document.getElementById('importFile').click();
}

function handleImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = JSON.parse(ev.target.result);
      editingData = { ...ZZ_DEFAULTS, ...data, favorites:{...ZZ_DEFAULTS.favorites,...(data.favorites||{})} };
      switchTab(activeTab);
      showToast('数据导入成功！点击保存以应用');
    } catch(err){ showToast('文件格式错误，请导入 .json 文件'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

init();
</script>
</body>
</html>
